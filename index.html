<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday AASHII 🎉</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    animation: bgAnimation 15s infinite alternate;
    cursor: pointer;
  }

  @keyframes bgAnimation {
    0% {background-color: #ff9a9e;}
    25% {background-color: #fad0c4;}
    50% {background-color: #fbc2eb;}
    75% {background-color: #a18cd1;}
    100% {background-color: #ff9a9e;}
  }

  h1, p {
    margin: 10px 20px;
    text-shadow: 2px 2px 5px #00000033;
  }

  h1 { font-size: 2.8rem; color: #ff69b4; }
  p { font-size: 1.5rem; font-weight: bold; animation: colorShift 5s infinite alternate; }

  @keyframes colorShift {
    0% {color: #ff0000;} 20% {color: #ff7f00;} 40% {color: #ffff00;} 60% {color: #00ff00;} 80% {color: #0000ff;} 100% {color: #8b00ff;}
  }

  /* Cake */
  .cake { position: relative; margin: 30px auto; width: 200px; height: 150px; cursor: pointer; z-index: 10; }
  .cake-layer { width: 100%; height: 50px; background: #ff69b4; border-radius: 10px; position: absolute; }
  .cake-layer:nth-child(1) { bottom: 0; }
  .cake-layer:nth-child(2) { bottom: 50px; background: #ff1493; }
  .cake-layer:nth-child(3) { bottom: 100px; background: #ff69b4; }

  .candle { width: 10px; height: 30px; background: yellow; position: absolute; top: -30px; left: 90px; border-radius: 2px; }
  .flame { width: 10px; height: 15px; background: orange; border-radius: 50%; position: absolute; top: -15px; left: 0; animation: flicker 0.5s infinite alternate; }
  @keyframes flicker { 0% {transform: scale(1);} 50% {transform: scale(1.2);} 100% {transform: scale(1);} }

  /* Balloons */
  .balloon { width: 40px; height: 60px; border-radius: 50%; position: absolute; bottom: -80px; animation: float 7s infinite linear; }
  .balloon::after { content: ''; width: 2px; height: 40px; background: #000; position: absolute; bottom: -40px; left: 50%; }
  @keyframes float { 0% {transform: translateY(0) rotate(0deg);} 50% {transform: translateY(-500px) rotate(15deg);} 100% {transform: translateY(0) rotate(-15deg);} }

  /* Confetti */
  .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; opacity: 0.9; pointer-events: none; animation: confetti-fall 2s linear forwards; }
  @keyframes confetti-fall { 0% {transform: translateY(0) rotate(0deg);} 100% {transform: translateY(500px) rotate(720deg); opacity: 0;} }

  /* Falling Stars */
  .star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: yellow;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation: starFall linear infinite;
  }

  @keyframes starFall {
    0% {transform: translateY(0) scale(1);}
    100% {transform: translateY(600px) scale(0);}
  }

  .final-msg { font-size: 2rem; font-weight: bold; color: #ff1493; margin-top: 20px; animation: rainbowText 5s infinite; }
  @keyframes rainbowText { 0% {color: #ff0000;} 20% {color: #ff7f00;} 40% {color: #ffff00;} 60% {color: #00ff00;} 80% {color: #0000ff;} 100% {color: #8b00ff;} }

  @media(max-width: 600px){
    h1 {font-size: 2rem;} p {font-size: 1.2rem;} .cake {width: 150px; height: 120px;} .cake-layer {height: 40px;} .candle {left: 65px;}
  }

  /* Button */
  #playMusicBtn {
    position: fixed;
    top: 40%;
    background: #ff1493;
    color: white;
    padding: 15px 25px;
    font-size: 1.5rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    z-index: 1000;
  }
</style>
</head>
<body>

<h1>In every beat of my heart ❤️, you live,</h1>
<p>In every dream 🌙, your smile shines bright ✨.</p>
<p>Through every moment, laughter 😂, and tear 😢,</p>
<p>I wish you endless love and joy 💖.</p>
<h1>HAPPY BIRTHDAY, MY LIZARD 🦎!</h1>

<div class="cake" id="cake">
  <div class="cake-layer"></div>
  <div class="cake-layer"></div>
  <div class="cake-layer"></div>
  <div class="candle">
    <div class="flame"></div>
  </div>
</div>

<!-- Balloons -->
<div class="balloon" style="background:red; left:10%; animation-delay:0s;"></div>
<div class="balloon" style="background:blue; left:30%; animation-delay:1s;"></div>
<div class="balloon" style="background:yellow; left:50%; animation-delay:2s;"></div>
<div class="balloon" style="background:green; left:70%; animation-delay:3s;"></div>
<div class="balloon" style="background:pink; left:90%; animation-delay:4s;"></div>

<div class="final-msg">
HAPPY BIRTHDAY MY LOVE, MY LIZARD, MERI CHHIPKALI, MERI AASHII 💕🫂
</div>

<button id="playMusicBtn">Click Anywhere to Play Music 🎵</button>

<audio id="bgMusic" loop>
  <source src="birthday-music.mp3" type="audio/mpeg">
</audio>

<script>
  const musicBtn = document.getElementById('playMusicBtn');
  const bgMusic = document.getElementById('bgMusic');

  function playMusic() {
    bgMusic.play();
    musicBtn.style.display = 'none';
    document.body.removeEventListener('click', playMusic);
  }

  document.body.addEventListener('click', playMusic);

  // Cake confetti
  document.getElementById('cake').addEventListener('click', function(e){
    e.stopPropagation();
    for(let i=0; i<50; i++){
      let confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
      confetti.style.left = (window.innerWidth/2 - 100 + Math.random()*200) + 'px';
      confetti.style.top = (window.innerHeight/2 - 75 + Math.random()*150) + 'px';
      document.body.appendChild(confetti);
      setTimeout(()=>confetti.remove(), 2000);
    }
    alert("Yay! Cake cut! 🎉🎂");
  });

  // Falling stars behind cake
  for(let i=0; i<30; i++){
    let star = document.createElement('div');
    star.classList.add('star');
    star.style.left = Math.random()*window.innerWidth + 'px';
    star.style.top = Math.random()*window.innerHeight + 'px';
    star.style.animationDuration = (3 + Math.random()*3) + 's';
    document.body.appendChild(star);
  }
</script>

</body>
</html>
